<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy - Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #4338ca;
        }

        .question {
            margin: 25px 0;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        label {
            display: block;
            padding: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4338ca;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #312e81;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #166534;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4338ca;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>📘 Study Buddy Quiz</h1>
    <p>AI Powered Academic Assessment</p>
    <hr>

    <form id="quizForm">

        <div class="question">
            <h3>1. What does CPU stand for?</h3>
            <label><input type="radio" name="q1" value="a"> Central Processing Unit</label>
            <label><input type="radio" name="q1" value="b"> Computer Personal Unit</label>
            <label><input type="radio" name="q1" value="c"> Control Program Unit</label>
        </div>

        <div class="question">
            <h3>2. Which language is used for C programming?</h3>
            <label><input type="radio" name="q2" value="a"> HTML</label>
            <label><input type="radio" name="q2" value="b"> C</label>
            <label><input type="radio" name="q2" value="c"> CSS</label>
        </div>

        <div class="question">
            <h3>3. Which device is used to type text?</h3>
            <label><input type="radio" name="q3" value="a"> Monitor</label>
            <label><input type="radio" name="q3" value="b"> Speaker</label>
            <label><input type="radio" name="q3" value="c"> Keyboard</label>
        </div>

        <div class="question">
            <h3>4. What is a good study habit?</h3>
            <label><input type="radio" name="q4" value="a"> Regular revision</label>
            <label><input type="radio" name="q4" value="b"> Never practising</label>
            <label><input type="radio" name="q4" value="c"> Avoiding questions</label>
        </div>

        <div class="question">
            <h3>5. What should you do after a wrong answer?</h3>
            <label><input type="radio" name="q5" value="a"> Give up</label>
            <label><input type="radio" name="q5" value="b"> Review and practise again</label>
            <label><input type="radio" name="q5" value="c"> Ignore the mistake</label>
        </div>

        <button type="button" onclick="checkAnswers()">
            Submit Quiz
        </button>

    </form>

    <div id="result" aria-live="polite"></div>

    <a href="index.html">← Back to Home</a>

</div>

<script>
function checkAnswers() {
    const answers = {
        q1: "a",
        q2: "b",
        q3: "c",
        q4: "a",
        q5: "b"
    };

    let score = 0;
    let attempted = 0;

    for (let question in answers) {
        const selected = document.querySelector(
            'input[name="' + question + '"]:checked'
        );

        if (selected) {
            attempted++;

            if (selected.value === answers[question]) {
                score++;
            }
        }
    }

    let message = "Your Score: " + score + " / 5";
    message += "<br>Questions Answered: " + attempted + " / 5";

    if (score === 5) {
        message += "<br>Excellent! 🎉";
    } else if (score >= 3) {
        message += "<br>Good job! Keep practising. 👍";
    } else {
        message += "<br>Keep learning and try again! 💪";
    }

    document.getElementById("result").innerHTML = message;
}
</script>

</body>
  </html>
